{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Moffee</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <section class="login-page">
        <div class="glass-card">
            <h1>Iniciar Sesión</h1>
            
            {% if messages %}
                {% for message in messages %}
                    <p style="color: #ff4d4d; text-align: center; font-weight: bold;">{{ message }}</p>
                {% endfor %}
            {% endif %}

            <form id="loginForm" method="POST">
                {% csrf_token %} 
                
                <div class="input-wrapper">
                    <label>Usuario</label>
                    <input type="text" name="username" id="userName" required>
                    <span class="input-icon">👤</span>
                </div>
                
                <div class="input-wrapper">
                    <label>Contraseña</label>
                    <input type="password" name="password" id="userPassword" required>
                    <span class="input-icon">🔑</span>
                </div>

                <button type="submit" class="login-button">Iniciar sesión</button>
            </form>

            <div class="register-footer">
                ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a>
            </div>
        </div>
    </section>

    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
