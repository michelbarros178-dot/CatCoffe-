{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Moffee</title>
    <!-- Usamos static para el CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<section class="login-page">
    <div class="glass-card">
        <h1>REGISTRARSE</h1>
        <!-- Añadimos method POST y el token de seguridad de Django -->
        <form method="POST" id="registerForm">
            {% csrf_token %}
            
            <div class="input-wrapper">
                <label>Nombre Completo</label>
                <input type="text" id="regName" name="nombre" required>
                <span class="input-icon">👤</span>
            </div>

            <div class="input-wrapper">
                <label>Email</label>
                <input type="email" id="regEmail" name="email" required>
                <span class="input-icon">✉</span>
            </div>

            <div class="input-wrapper">
                <label>Número de Teléfono</label>
                <input type="tel" id="regPhone" name="telefono" required>
                <span class="input-icon">📞</span>
            </div>
            
            <div class="input-wrapper">
                <label>Contraseña</label>
                <!-- Es importante ponerle el atributo name para que Django lo reciba -->
                <input type="password" id="regPassword" name="password" required>
                <span class="input-icon">🔒</span>
            </div>

            <button type="submit" class="login-button">Crear cuenta</button>
        </form>
        
        <div class="register-footer">
            ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
        </div>
    </div>
</section>

    <!-- JS con etiqueta static -->
    <script src="{% static 'js/registro.js' %}"></script>
</body>
</html>
